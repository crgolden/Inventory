name: Build and deploy ASP.Net Core app to Azure Web App - crgolden-inventory

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  sync-lock-files:
    name: Sync Dependabot lock files
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v6
        if: github.actor == 'dependabot[bot]'
        with:
          ref: ${{ github.head_ref }}

      - name: Set up .NET Core
        if: github.actor == 'dependabot[bot]'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Regenerate lock files and push
        if: github.actor == 'dependabot[bot]'
        env:
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          dotnet restore --force-evaluate
          if (-not (git status --porcelain -- '*packages.lock.json')) {
            Write-Output 'Lock files already consistent; nothing to push.'
            exit 0
          }
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add -- '*packages.lock.json'
          git commit -m 'Regenerate packages.lock.json for transitive project references'
          git push origin "HEAD:$env:HEAD_REF"

  build:
    name: Build and analyze
    needs: sync-lock-files
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    permissions:
      id-token: write #This is required for requesting the JWT (needed for Azure OIDC in E2E tests)
      contents: read #This is required for actions/checkout
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

    steps:
      - name: Set up JDK 21
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarQube Cloud packages
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true' && github.actor != 'dependabot[bot]'
        run: |
          New-Item -Path ${{ runner.temp }}/scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Cache dotnet global tools
        id: cache-dotnet-tools
        uses: actions/cache@v5
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-dotnet-tools-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: inventory.client/.nvmrc
          registry-url: https://npm.pkg.github.com

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('inventory.client/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm dependencies
        working-directory: inventory.client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci

      - name: Restore local tools
        run: dotnet tool restore

      - name: Lint
        working-directory: inventory.client
        run: npm run lint

      - name: Type-check E2E specs
        working-directory: inventory.client
        run: npm run typecheck:e2e

      - name: Type-check unit specs
        working-directory: inventory.client
        run: npm run typecheck:spec

      - name: Lint stylesheets
        working-directory: inventory.client
        run: npm run lint:css

      - name: Begin Sonar analysis
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin `
            /k:"$env:SONAR_PROJECT_KEY" `
            /o:"$env:SONAR_ORGANIZATION" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml" `
            /d:sonar.javascript.lcov.reportPaths="coverage/lcov.info" `
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/*.d.ts" `
            /d:sonar.coverage.exclusions="inventory.client/e2e/**,inventory.client/src/test-setup*.ts,**/Program.cs,inventory.client/**/*.config.*,inventory.client/src/environments/**,inventory.client/src/main.ts,inventory.client/aspnetcore-https.js,inventory.client/start-os.js,gate.ps1" `
            /d:sonar.test.inclusions="**/*.spec.ts" `
            /d:sonar.qualitygate.wait=true `
            /d:sonar.scanner.skipJreProvisioning=true

      - name: Build with dotnet
        env:
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.PACKAGES_READ_TOKEN }}
        run: dotnet build --no-incremental --configuration Release /p:AngularConfiguration=ci /p:RestoreLockedMode=true -warnaserror

      - name: ReSharper inspection (jb inspectcode)
        run: |
          dotnet jb inspectcode Inventory.slnx --no-build -e=WARNING --output=inspectcode.sarif --exclude="**/coverage/**;**/dist/**;**/node_modules/**;**/bin/**;**/obj/**"
          $results = @((Get-Content inspectcode.sarif -Raw | ConvertFrom-Json).runs | ForEach-Object { $_.results })
          foreach ($result in $results) {
            $location = $result.locations[0].physicalLocation
            Write-Output "::error file=$($location.artifactLocation.uri),line=$($location.region.startLine)::$($result.ruleId) $($result.message.text)"
          }
          if ($results.Count -gt 0) { exit 1 }

      - name: Run unit tests with coverage
        run: |
          dotnet coverlet Inventory.Tests.Unit/bin/Release/net10.0 `
            --target "dotnet" `
            --targetargs "test --project Inventory.Tests.Unit --no-build --configuration Release -- --filter-trait Category=Unit --stop-on-fail on --report-xunit-trx --report-xunit-trx-filename unit-tests.trx --results-directory=Inventory.Tests.Unit/bin/Release/net10.0/TestResults" `
            --format opencover --output "coverage.opencover.xml" `
            --skipautoprops `
            --exclude-by-attribute GeneratedCodeAttribute `
            --exclude-by-file "**/obj/**" `
            --exclude-by-file "**/Program.cs" `
            --does-not-return-attribute DoesNotReturnAttribute `
            --include "[Inventory.Server]*"

      - name: Get Playwright version
        id: playwright-version
        if: github.actor != 'dependabot[bot]'
        shell: pwsh
        run: |
          $lock = Get-Content inventory.client/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $version = $lock.packages['node_modules/@playwright/test'].version
          if (-not $version) { throw 'Could not read the @playwright/test version, so the browser cache key would silently collapse to a constant.' }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: cache-playwright
        if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: inventory.client
        run: npm run playwright:install

      - name: Run UI tests
        working-directory: inventory.client
        run: npx vitest run --coverage

      - name: Fix LCOV paths for SonarQube
        if: github.actor != 'dependabot[bot]'
        run: |
          (Get-Content "inventory.client/coverage/lcov.info") `
            -replace '\\', '/' |
            Set-Content "inventory.client/coverage/lcov.info"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: test-results
          if-no-files-found: error
          path: |
            Inventory.Tests.Unit/bin/Release/net10.0/TestResults/

      - name: Create the HTTPS development certificate
        run: dotnet dev-certs https

      - name: Run browser E2E tests
        id: browser-e2e
        working-directory: inventory.client
        env:
          ASPNETCORE_ENVIRONMENT: CI
        run: npm run e2e:ci

      - name: Assert browser E2E executed at least its floor
        working-directory: inventory.client
        if: always()
        shell: pwsh
        run: |
          $results = 'playwright-results.xml'
          if (-not (Test-Path $results)) {
            Write-Output "::error::$results is missing - the browser E2E suite never reported."
            exit 1
          }
          $floor = [int](Get-Content e2e/e2e-settings.json -Raw | ConvertFrom-Json).executedTestFloor
          $xml = [xml](Get-Content $results)
          $tests = [int]($xml.testsuites.tests ?? 0)
          $skipped = [int]($xml.testsuites.skipped ?? 0)
          $executed = $tests - $skipped
          Write-Output "Browser E2E executed $executed (tests $tests, skipped $skipped), floor $floor" >> $env:GITHUB_STEP_SUMMARY
          if ($floor -le 0 -or $executed -lt $floor) {
            Write-Output "::error::Browser E2E executed $executed tests, below its floor of $floor."
            exit 1
          }

      - name: Publish E2E scenario results
        working-directory: inventory.client
        if: ${{ !cancelled() && (steps.browser-e2e.outcome == 'success' || steps.browser-e2e.outcome == 'failure') && github.actor != 'dependabot[bot]' }}
        shell: pwsh
        env:
          PGHOST: ${{ vars.TEST_RESULTS_PGHOST }}
          PGDATABASE: ${{ vars.TEST_RESULTS_PGDATABASE }}
          PGUSER: ${{ vars.TEST_RESULTS_PGUSER }}
          PGSSLMODE: ${{ vars.TEST_RESULTS_PGSSLMODE }}
          PGPASSWORD: ${{ secrets.TEST_RESULTS_PGPASSWORD }}
        run: |
          $messages = (Get-Content e2e/e2e-settings.json -Raw | ConvertFrom-Json).cucumberMessagesFile
          npx --no -- publish-bdd-results --app ${{ vars.TEST_RESULTS_APP }} $messages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check template classes against the built CSS
        working-directory: inventory.client
        run: npm run lint:utilities

      - name: Upload browser E2E artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: inventory-browser-e2e-artifacts
          path: |
            inventory.client/playwright-report/
            inventory.client/playwright-results.xml
            inventory.client/cucumber-report/
          if-no-files-found: ignore

      - name: dotnet publish
        env:
          NuGetPackageSourceCredentials_GitHub: Username=${{ github.actor }};Password=${{ secrets.PACKAGES_READ_TOKEN }}
        run: >
          dotnet publish Inventory.Server/Inventory.Server.csproj
          -c Release
          -r win-x86
          --self-contained false
          -o ${{ github.workspace }}/publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

      - name: End Sonar analysis
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Fail on open Sonar issues
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $scope = if ($env:PULL_REQUEST) { "pullRequest=$env:PULL_REQUEST" } else { "branch=$env:BRANCH" }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:SONAR_TOKEN):"))
          $report = Invoke-RestMethod -Headers @{ Authorization = "Basic $auth" } -Uri "https://sonarcloud.io/api/issues/search?componentKeys=$env:SONAR_PROJECT_KEY&$scope&issueStatuses=OPEN,CONFIRMED&ps=500"
          foreach ($issue in $report.issues) {
            Write-Output "::error file=$($issue.component -replace '^[^:]*:'),line=$($issue.line)::$($issue.rule) $($issue.message)"
          }
          Write-Output "$($report.total) open Sonar issue(s) on $scope"
          if ($null -eq $report.total -or $report.total -ne 0) { exit 1 }

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      webapp-url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A918A9717FCF45BE8C2EB26C9E6DE0B9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EA921DF12CE349A2A30F70DF5FC7E238 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_854298C5385549E1A9D598A4DD3DAC06 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: 'crgolden-inventory'
          slot-name: 'Production'
          package: .
