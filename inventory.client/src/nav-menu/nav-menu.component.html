<header>
  <nav class="mb-4 bg-chrome py-2 shadow-sm">
    <div crgPageContainer class="flex flex-wrap items-center justify-between">
      <a class="mr-4 py-1.25 text-lead text-on-fill/90 no-underline hover:text-on-fill focus:text-on-fill" [routerLink]="['/']">Inventory</a>
      <button
        class="cursor-pointer rounded-md border border-on-fill/10 bg-transparent px-3 py-1 text-lead text-on-fill/90 hover:text-on-fill sm:hidden"
        type="button"
        aria-label="Toggle navigation"
        aria-controls="nav-collapse"
        [attr.aria-expanded]="isExpanded()"
        (click)="toggle()"
      >
        <ng-icon name="lucideMenu" size="1.5em" aria-hidden="true" />
      </button>
      <div
        id="nav-collapse"
        class="flex grow basis-full items-center sm:basis-auto sm:justify-end max-sm:hidden max-sm:data-[open=true]:flex"
        [attr.data-open]="isExpanded()"
      >
        <ul class="m-0 flex list-none flex-col p-0 sm:flex-row">
          <li>
            <a
              id="nav-home"
              class="block py-2 text-on-fill/90 no-underline hover:text-on-fill focus:text-on-fill sm:px-2 aria-[current=page]:border-b-2 aria-[current=page]:border-on-fill/70 aria-[current=page]:pb-[calc(0.5rem_-_2px)] aria-[current=page]:text-on-fill"
              [routerLink]="['/']"
              routerLinkActive
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: true }"
            >Home</a>
          </li>

          <li>
            <a
              id="nav-catalog"
              class="block py-2 text-on-fill/90 no-underline hover:text-on-fill focus:text-on-fill sm:px-2 aria-[current=page]:border-b-2 aria-[current=page]:border-on-fill/70 aria-[current=page]:pb-[calc(0.5rem_-_2px)] aria-[current=page]:text-on-fill"
              [routerLink]="['/catalog']"
              routerLinkActive
              ariaCurrentWhenActive="page"
            >Catalog</a>
          </li>

          @if (isAuthenticated()) {
            <li>
              <a
                id="nav-products"
                class="block py-2 text-on-fill/90 no-underline hover:text-on-fill focus:text-on-fill sm:px-2 aria-[current=page]:border-b-2 aria-[current=page]:border-on-fill/70 aria-[current=page]:pb-[calc(0.5rem_-_2px)] aria-[current=page]:text-on-fill"
                [routerLink]="['/products']"
                routerLinkActive
                ariaCurrentWhenActive="page"
              >My Products</a>
            </li>
          } @else {
            <li>
              <a id="nav-login" class="block py-2 text-on-fill/90 no-underline hover:text-on-fill focus:text-on-fill sm:px-2" href="/bff/login">Login</a>
            </li>
          }

          @if (isAuthenticated()) {
            <li>
              <a id="nav-signout" class="block py-2 text-on-fill/90 no-underline hover:text-on-fill focus:text-on-fill sm:px-2" [href]="logoutUrl()">Signout</a>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</header>
